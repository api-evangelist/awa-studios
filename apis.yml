aid: awa-studios
name: Awa Studios
description: >-
  AWA Studios (Artists, Writers & Artisans, Inc.) is a New York-based independent
  multimedia entertainment company founded in 2018 by comics-industry veterans,
  including former Marvel editor-in-chief Axel Alonso and former Marvel president
  Bill Jemas, with media executive Jon Miller as board chairman. AWA publishes
  original comic books and graphic novels across action, crime, horror, science
  fiction, and fantasy genres, built around a creator-owned business model that
  offers favorable terms to writers and artists. The company operates the "Upshot"
  imprint and a shared "Resistance Universe," runs a direct-to-consumer shop for
  print and digital titles, and develops film and television adaptations of its
  properties. AWA received seed-stage funding from Lightspeed Venture Partners in
  2018. It is a media and entertainment company and does not currently publish a
  public developer API.
